<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Timer</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app is-blinking" id="app" data-mode="prep">
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

      <!-- Prep Mode -->
      <section class="panel" id="panel-prep" aria-labelledby="prep-title">
        <h2 class="sr-only" id="prep-title">準備モード</h2>

        <div class="settings-row" aria-label="タイマー選択">
          <div class="settings-col">
            <div class="preset-header">
              <div class="preset-title">休憩</div>
              <div class="preset-header__right" aria-hidden="true"></div>
            </div>
            <label class="field">
              <input
                id="breakMinutesInput"
                class="field__input"
                type="number"
                inputmode="numeric"
                min="1"
                max="20"
                step="1"
                aria-label="制限分数"
              />
            </label>
            <input
              id="breakMinutesSlider"
              class="slider"
              type="range"
              min="1"
              max="20"
              step="1"
              aria-label="制限分数スライダー"
            />
            <button class="btn btn--primary" id="breakStartBtn" type="button">開始</button>
          </div>

          <div class="settings-col">
            <div class="preset-header">
              <div class="preset-title">作業</div>
              <div class="count-tools" aria-label="カウントモード">
                <label class="check" aria-label="カウントトグル">
                  <input id="countToggle" class="check__input" type="checkbox" />
                  <span class="check__box" aria-hidden="true"></span>
                </label>
                <button class="icon-btn" id="countResetBtn" type="button" aria-label="カウントをリセット">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 5a7 7 0 1 1-6.1 3.6a1 1 0 0 1 1.74-1A5 5 0 1 0 12 7h-1.2a1 1 0 0 1-.7-1.71l2.2-2.2a1 1 0 0 1 1.4 0l2.2 2.2A1 1 0 0 1 15.2 7H12Z"
                    />
                  </svg>
                </button>
                <div class="count-display" id="countTotalDisplay" aria-label="カウント合計">0:00:00</div>
              </div>
            </div>
            <label class="field">
              <input
                id="workMinutesInput"
                class="field__input field__input--orange"
                type="number"
                inputmode="numeric"
                min="1"
                max="20"
                step="1"
                aria-label="ノルマ分数"
              />
            </label>
            <input
              id="workMinutesSlider"
              class="slider slider--orange"
              type="range"
              min="1"
              max="20"
              step="1"
              aria-label="ノルマ分数スライダー"
            />
            <button class="btn btn--primary btn--orange" id="workStartBtn" type="button">開始</button>
          </div>
        </div>
      </section>

      <!-- Running Mode -->
      <section class="panel panel--center" id="panel-running" aria-labelledby="running-title" hidden>
        <h2 class="sr-only" id="running-title">作動モード</h2>

        <div class="gauge" role="img" aria-label="進捗ゲージ">
          <svg class="gauge__svg" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="gauge__track" cx="60" cy="60" r="52"></circle>
            <circle class="gauge__progress" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="gauge__center">
            <div class="time" id="timeDisplay" aria-live="polite" aria-atomic="true">00:00</div>
            <div class="sub" id="runningLabel"></div>
            <div class="sub" id="workCountStatus" hidden></div>
            <div class="sub" id="workCountLive" hidden></div>
          </div>
        </div>

        <button class="btn btn--primary" id="stopBtn" type="button">停止</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
